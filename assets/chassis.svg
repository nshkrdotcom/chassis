<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="chassis-title chassis-desc">
  <title id="chassis-title">Chassis</title>
  <desc id="chassis-desc">A premium hexagonal server chassis frame showing spatial node boards, mounted rails, circuit routing tracks, and glowing status indicators.</desc>
  <defs>
    <clipPath id="chassis-hex">
      <path d="M100 4 L183 52 L183 148 L100 196 L17 148 L17 52 Z"/>
    </clipPath>
    <linearGradient id="chassis-bg" x1="35" y1="24" x2="169" y2="181" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c354a"/>
      <stop offset="0.55" stop-color="#111622"/>
      <stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="chassis-metal" x1="50" y1="50" x2="150" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chassis-glow" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="chassis-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g clip-path="url(#chassis-hex)">
    <!-- Hex Background -->
    <path d="M100 4 L183 52 L183 148 L100 196 L17 148 L17 52 Z" fill="url(#chassis-bg)"/>
    
    <!-- Outer Routing Circuit Tracks -->
    <g stroke="url(#chassis-glow)" stroke-width="1.5" opacity="0.32" fill="none">
      <path d="M45 50 L100 22 L155 50"/>
      <path d="M45 150 L100 178 L155 150"/>
      <path d="M30 65 V135 M170 65 V135"/>
      <path d="M40 76 H160"/>
      <path d="M40 124 H160"/>
      <path d="M100 22 V178"/>
    </g>

    <!-- Structural Chassis Frame (Motherboard Block) -->
    <g filter="url(#chassis-shadow)">
      <!-- Main board backplate -->
      <rect x="44" y="54" width="112" height="92" rx="6" fill="#161e2e" stroke="#4b5563" stroke-width="2"/>
      
      <!-- Mounting Rails -->
      <rect x="36" y="60" width="8" height="80" rx="2" fill="url(#chassis-metal)" stroke="#93c5fd" stroke-width="1"/>
      <rect x="156" y="60" width="8" height="80" rx="2" fill="url(#chassis-metal)" stroke="#93c5fd" stroke-width="1"/>
      
      <!-- Horizontal slide tracks -->
      <line x1="44" y1="75" x2="156" y2="75" stroke="#374151" stroke-width="2"/>
      <line x1="44" y1="100" x2="156" y2="100" stroke="#374151" stroke-width="2"/>
      <line x1="44" y1="125" x2="156" y2="125" stroke="#374151" stroke-width="2"/>
    </g>

    <!-- Server Blade Modules (Mounted Nodes) -->
    <!-- Blade 1 (Top) -->
    <g transform="translate(48, 62)">
      <rect x="0" y="0" width="104" height="24" rx="3" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5"/>
      <!-- Glowing CPU/Status indicators -->
      <circle cx="12" cy="12" r="3" fill="#34d399" /> <!-- Alive Green -->
      <circle cx="22" cy="12" r="3" fill="#3b82f6" opacity="0.8"/> <!-- Mesh Active -->
      <!-- Connection port representations -->
      <rect x="68" y="7" width="10" height="10" rx="1" fill="#4b5563"/>
      <rect x="82" y="7" width="14" height="10" rx="1" fill="#4b5563"/>
      <line x1="32" y1="12" x2="60" y2="12" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Blade 2 (Middle - Status indicator show progress/yellow) -->
    <g transform="translate(48, 88)">
      <rect x="0" y="0" width="104" height="24" rx="3" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="12" cy="12" r="3" fill="#fbbf24" /> <!-- In-progress Amber -->
      <circle cx="22" cy="12" r="3" fill="#3b82f6" opacity="0.3"/> <!-- Mesh Syncing -->
      <rect x="68" y="7" width="10" height="10" rx="1" fill="#4b5563"/>
      <rect x="82" y="7" width="14" height="10" rx="1" fill="#4b5563"/>
      <line x1="32" y1="12" x2="60" y2="12" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="3,3"/>
    </g>

    <!-- Blade 3 (Bottom - Empty slide bay, exposing topology lines) -->
    <g transform="translate(48, 114)">
      <rect x="0" y="0" width="104" height="24" rx="3" fill="#111827" stroke="#4b5563" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="12" cy="12" r="3" fill="#6b7280" /> <!-- Offline/Ready Gray -->
      <line x1="32" y1="12" x2="90" y2="12" stroke="#374151" stroke-width="1" stroke-dasharray="4,4"/>
    </g>

    <!-- Top Connection Hub -->
    <path d="M85 36 H115 L108 46 H92 Z" fill="#1f2937" stroke="url(#chassis-glow)" stroke-width="1.5"/>
    <circle cx="100" cy="41" r="2.5" fill="#3b82f6"/>

    <!-- Bottom Command Pipeline / Status Terminal -->
    <path d="M72 155 H128 L120 165 H80 Z" fill="#0d1117" stroke="#4facfe" stroke-width="1.5"/>
    <rect x="86" y="158" width="28" height="4" rx="1" fill="#4facfe" opacity="0.7"/>

    <!-- Hex Outer border highlights -->
    <path d="M100 4 L183 52 L183 148 L100 196 L17 148 L17 52 Z" fill="none" stroke="url(#chassis-glow)" stroke-width="4.2"/>
  </g>
</svg>
